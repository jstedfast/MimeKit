name: Fuzz

on:
  schedule:
    # Every night at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to fuzz each target (in seconds)'
        required: false
        default: '600'
      target:
        description: 'The fuzz target to run (or "all")'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Select the fuzz targets
        id: targets
        shell: pwsh
        run: |
          $all = @(
            'address-parser', 'authentication-results', 'compliance-validators', 'decoders',
            'dkim-arc-verifier', 'dmarc-verifier',             'dns-records', 'encoders', 'filters',
                        'header-values', 'html-tokenizer', 'mime-parser', 'mime-reader', 'rfc2047', 'rtf-compressed',
            'rtf-converters', 'rtf-tokenizer', 'smtputf8-validator', 'text-converters',
            'tnef-message', 'tnef-reader'
          )
          $target = '${{ inputs.target }}'
          # Wrap in @() since PowerShell unrolls a single-element array returned from an if expression.
          $targets = @(if ($target -eq '' -or $target -eq 'all') { $all } else { $target })
          "matrix=$(ConvertTo-Json -Compress -InputObject $targets)" >> $env:GITHUB_OUTPUT

  fuzz:
    needs: targets
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    env:
      DURATION: ${{ inputs.duration || '3600' }}
      CORPUS_PATH: artifacts/fuzz/${{ matrix.target }}/corpus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup/Install the .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The corpus grows from run to run, so each run restores the newest corpus for its target and saves
      # the result under a new key (caches are immutable).
      - name: Restore the corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CORPUS_PATH }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The HTML oracle asks a real browser to confirm any failure that AngleSharp reports (see Fuzzing/Helpers/BrowserOracle.cs).
      # It prefers the preinstalled Google Chrome, so Playwright's Chromium only gets installed if Chrome is missing.
      - name: Ensure a browser is installed
        if: matrix.target == 'html-tokenizer' || matrix.target == 'rtf-converters'
        run: google-chrome --version || npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        shell: pwsh
        run: ./scripts/fuzz.ps1 -Target ${{ matrix.target }} -Duration $env:DURATION

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CORPUS_PATH }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the crashing inputs
        id: crashes
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-crashes
          path: |
            artifacts/fuzz/${{ matrix.target }}/crashes/
            artifacts/fuzz/${{ matrix.target }}/fuzz.log*
          if-no-files-found: ignore
          retention-days: 30

      - name: Report fuzzing failures
        if: failure() && !cancelled() && steps.fuzz.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          CRASH_ARTIFACT_URL: ${{ steps.crashes.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const target = process.env.FUZZ_TARGET;
            const directory = `artifacts/fuzz/${target}/crashes`;
            if (!fs.existsSync(directory)) {
              core.info('No crashing inputs; skipping issue reporting.');
              return;
            }

            const crashes = fs.readdirSync(directory, { withFileTypes: true })
              .filter(entry => entry.isFile() && /^(crash-|deadly-signal|timeout-|oom-)/.test(entry.name));
            if (crashes.length === 0) {
              core.info('No crashing inputs; skipping issue reporting.');
              return;
            }

            const { owner, repo } = context.repo;
            const marker = `<!-- mimekit-fuzz:${target} -->`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const artifactUrl = process.env.CRASH_ARTIFACT_URL;
            const body = [
              marker,
              `Fuzzing found ${crashes.length} failing input(s) for **${target}**.`,
              '',
              `Commit: ${context.sha}`,
              `Workflow run: ${runUrl}`,
              artifactUrl
                ? `Crashing inputs and logs: ${artifactUrl} (retained for 30 days).`
                : 'Crash artifact upload was unsuccessful; see the workflow logs.'
            ].join('\n');

            for await (const { data: issues } of github.paginate.iterator(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            })) {
              const issue = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
                core.info(`Updated ${issue.html_url}`);
                return;
              }
            }

            const { data: issue } = await github.rest.issues.create({
              owner, repo, title: `Fuzzing failure: ${target}`, body
            });
            core.info(`Created ${issue.html_url}`);
