name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'The full 40-character commit hash to release (the version is read from the nuspec files at that commit)'
        required: true
        type: string
      sign:
        description: 'Code-sign the assemblies and NuGet packages (using the .NET Foundation code-signing certificate)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_PLATFORM: Any CPU
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:

    # Validate that the input looks like a commit hash (before using it for anything)
    - name: Validate Commit Hash
      shell: pwsh
      env:
        RELEASE_COMMIT: ${{ inputs.commit }}
      run: |
        if ($env:RELEASE_COMMIT -cnotmatch '^[0-9a-fA-F]{40}$') {
          Write-Host "::error::Invalid commit hash (must be the full 40-character SHA): '$env:RELEASE_COMMIT'"
          exit 1
        }

    # Setup/Install the .NET SDKs
    - name: Setup/Install the .NET SDKs
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # Setup MSBuild (needed for building .NET Framework projects)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # Checkout the requested commit
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ inputs.commit }}
        submodules: recursive
        fetch-depth: 0

    # Determine the release version from the nuspec files and make sure that all of the version numbers agree
    - name: Determine Release Version
      id: release_version
      shell: pwsh
      run: |
        $commit = git rev-parse HEAD
        $errors = @()
        $versions = @{}

        foreach ($id in 'MimeKit.Core', 'MimeKit.Cryptography', 'MimeKit') {
          [xml] $nuspec = Get-Content "nuget/$id.nuspec"
          $versions["nuget/$id.nuspec <version>"] = $nuspec.package.metadata.version

          foreach ($dependency in $nuspec.package.metadata.dependencies.group.dependency) {
            if ($dependency.id -like 'MimeKit*') {
              $versions["nuget/$id.nuspec $($dependency.id) dependency ($($dependency.ParentNode.targetFramework))"] = $dependency.version
            }
          }
        }

        foreach ($project in 'MimeKit/MimeKit.csproj', 'MimeKit.Cryptography/MimeKit.Cryptography.csproj') {
          [xml] $csproj = Get-Content $project
          $versions["$project <VersionPrefix>"] = ($csproj.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1)
        }

        $version = $versions['nuget/MimeKit.nuspec <version>']

        if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$') {
          $errors += "Invalid release version: '$version'"
        }

        foreach ($entry in $versions.GetEnumerator() | Sort-Object Key) {
          Write-Host "$($entry.Key): $($entry.Value)"

          if ($entry.Value -ne $version) {
            $errors += "$($entry.Key) is '$($entry.Value)' (expected '$version')"
          }
        }

        # Fail early if this version has already been tagged on a different commit
        $tagged = git rev-parse -q --verify "refs/tags/${version}^{commit}"
        if ($tagged -and $tagged -ne $commit) {
          $errors += "Tag '$version' already exists and points to $tagged (not $commit)"
        }

        if ($errors.Count -gt 0) {
          $errors | ForEach-Object { Write-Host "::error::$_" }
          exit 1
        }

        Write-Host "Releasing MimeKit $version from $commit"
        [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=${version}$([Environment]::NewLine)")

        # Note: GitHub's pwsh wrapper exits with $LASTEXITCODE, which is 1 here because `git rev-parse --verify`
        # fails when the release tag does not exist yet (the normal case).
        exit 0

    # Restore .NET tools
    - name: Run .NET tool restore
      shell: pwsh
      run: |
        dotnet tool restore

    # Restore MimeKit.sln
    - name: Restore MimeKit.sln
      shell: pwsh
      run: |
        dotnet restore MimeKit.sln

    # Build MimeKit (MimeKit.sln builds both the MimeKit.Core and MimeKit.Cryptography assemblies)
    - name: Build MimeKit
      shell: pwsh
      run: |
        dotnet msbuild MimeKit.sln -property:Platform=$env:BUILD_PLATFORM -property:Configuration=Release

    # Create MimeKit.Core NuGet package
    - name: Create MimeKit.Core NuGet package
      shell: pwsh
      run: |
        nuget pack nuget/MimeKit.Core.nuspec

    # Create MimeKit.Cryptography NuGet package
    - name: Create MimeKit.Cryptography NuGet package
      shell: pwsh
      run: |
        nuget pack nuget/MimeKit.Cryptography.nuspec

    # Create the MimeKit meta-package (depends on MimeKit.Core and MimeKit.Cryptography)
    - name: Create MimeKit NuGet package
      shell: pwsh
      run: |
        nuget pack nuget/MimeKit.nuspec

    # Upload unsigned NuGet packages
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: BuildArtifacts
        if-no-files-found: error
        path: |
          MimeKit.Core.${{ steps.release_version.outputs.version }}.nupkg
          MimeKit.Cryptography.${{ steps.release_version.outputs.version }}.nupkg
          MimeKit.${{ steps.release_version.outputs.version }}.nupkg

  sign:
    needs: build
    runs-on: windows-latest
    environment: release
    env:
      BUILD_PLATFORM: Any CPU
    permissions:
      id-token: write # Required for requesting the JWT (Azure login and Sigstore signing of attestations)
      attestations: write # Required for persisting build provenance attestations
      contents: read

    steps:

    # Setup NuGet CLI (needed for nuget pack and nuget push)
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    # Restore build artifacts from the build job
    - name: Download Build Artifacts
      uses: actions/download-artifact@v8
      with:
        name: BuildArtifacts
        path: ./

    # Note: All of the code-signing steps below are conditional on the `sign` workflow input.

    # Setup .NET (needed for the Sign CLI tool)
    - name: Setup .NET
      if: inputs.sign
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Install Sign CLI tool
    - name: Install Sign CLI tool
      if: inputs.sign
      run: dotnet tool install --tool-path . --prerelease sign

    # Login to Azure using a ServicePrincipal configured to authenticate against a GitHub Action
    - name: 'Az CLI login'
      if: inputs.sign
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Sign MimeKit.Core NuGet Package (sign CLI signs assemblies inside the .nupkg first, then the .nupkg itself)
    - name: Sign MimeKit.Core NuGet Package
      if: inputs.sign
      shell: pwsh
      run: >
        ./sign code azure-key-vault
        MimeKit.Core.${{ needs.build.outputs.version }}.nupkg
        --base-directory "${{ github.workspace }}"
        --publisher-name "MimeKit"
        --description "MimeKit.Core"
        --description-url "https://github.com/jstedfast/MimeKit"
        --azure-credential-type "azure-cli"
        --azure-key-vault-url "https://sc-mimekit.vault.azure.net/"
        --azure-key-vault-certificate "SC-MIMEKIT"

    # Sign MimeKit.Cryptography NuGet Package (sign CLI signs assemblies inside the .nupkg first, then the .nupkg itself)
    - name: Sign MimeKit.Cryptography NuGet Package
      if: inputs.sign
      shell: pwsh
      run: >
        ./sign code azure-key-vault
        MimeKit.Cryptography.${{ needs.build.outputs.version }}.nupkg
        --base-directory "${{ github.workspace }}"
        --publisher-name "MimeKit"
        --description "MimeKit.Cryptography"
        --description-url "https://github.com/jstedfast/MimeKit"
        --azure-credential-type "azure-cli"
        --azure-key-vault-url "https://sc-mimekit.vault.azure.net/"
        --azure-key-vault-certificate "SC-MIMEKIT"

    # Sign the MimeKit meta-package (contains no assemblies, so only the .nupkg itself is signed)
    - name: Sign MimeKit NuGet Package
      if: inputs.sign
      shell: pwsh
      run: >
        ./sign code azure-key-vault
        MimeKit.${{ needs.build.outputs.version }}.nupkg
        --base-directory "${{ github.workspace }}"
        --publisher-name "MimeKit"
        --description "MimeKit"
        --description-url "https://github.com/jstedfast/MimeKit"
        --azure-credential-type "azure-cli"
        --azure-key-vault-url "https://sc-mimekit.vault.azure.net/"
        --azure-key-vault-certificate "SC-MIMEKIT"

    # Extract the (final, possibly signed) assemblies from the NuGet packages so that they can be attested too.
    #
    # Note: This must happen after any step that modifies the NuGet packages (e.g. code-signing). Also note that
    # NuGet.org adds its own repository signature to every package, which changes the hash of the .nupkg that
    # consumers download (but not the hashes of the assemblies inside of it).
    - name: Extract Assemblies
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem

        foreach ($id in 'MimeKit.Core', 'MimeKit.Cryptography') {
          [IO.Compression.ZipFile]::ExtractToDirectory("$id.$env:RELEASE_VERSION.nupkg", "ExtractedAssemblies/$id")
        }

        $assemblies = Get-ChildItem -Path ExtractedAssemblies -Filter *.dll -Recurse
        if ($assemblies.Count -eq 0) {
          Write-Host "::error::No assemblies were found in the NuGet packages"
          exit 1
        }

        $assemblies | ForEach-Object { Write-Host $_.FullName }

    # Generate signed build provenance attestations for the NuGet packages and the assemblies within them
    # (these can be verified using `gh attestation verify <file> --repo jstedfast/MimeKit`)
    - name: Attest Build Provenance
      uses: actions/attest@v4
      with:
        subject-path: |
          MimeKit.Core.${{ needs.build.outputs.version }}.nupkg
          MimeKit.Cryptography.${{ needs.build.outputs.version }}.nupkg
          MimeKit.${{ needs.build.outputs.version }}.nupkg
          ExtractedAssemblies/**/*.dll

    # Upload the final NuGet packages as artifacts
    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ReleaseArtifacts
        if-no-files-found: error
        path: |
          MimeKit.Core.${{ needs.build.outputs.version }}.nupkg
          MimeKit.Cryptography.${{ needs.build.outputs.version }}.nupkg
          MimeKit.${{ needs.build.outputs.version }}.nupkg

    # Get a short-lived NuGet API key
    - name: Get NuGet API Key
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ${{ secrets.NUGET_USER }}

    # Publish MimeKit.Core.{version}.nupkg to NuGet.org
    #
    # Note: MimeKit.Core and MimeKit.Cryptography must be pushed *before* the MimeKit
    # meta-package, otherwise NuGet.org cannot resolve the meta-package's dependencies.
    - name: Push MimeKit.Core package to NuGet.org
      shell: pwsh
      run: |
        nuget push $env:NUGET_PKG_PATH -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json
      env:
        NUGET_PKG_PATH: MimeKit.Core.${{ needs.build.outputs.version }}.nupkg
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

    # Publish MimeKit.Cryptography.{version}.nupkg to NuGet.org
    - name: Push MimeKit.Cryptography package to NuGet.org
      shell: pwsh
      run: |
        nuget push $env:NUGET_PKG_PATH -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json
      env:
        NUGET_PKG_PATH: MimeKit.Cryptography.${{ needs.build.outputs.version }}.nupkg
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

    # Publish the MimeKit.{version}.nupkg meta-package to NuGet.org (must be pushed last)
    - name: Push MimeKit package to NuGet.org
      shell: pwsh
      run: |
        nuget push $env:NUGET_PKG_PATH -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json
      env:
        NUGET_PKG_PATH: MimeKit.${{ needs.build.outputs.version }}.nupkg
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

  tag:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing the release tag

    steps:

    # Checkout the released commit
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.commit }}
        fetch-depth: 0

    # Create and push an annotated release tag (e.g. 5.0.0) for the released commit
    - name: Create Release Tag
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        TAGGER_NAME: ${{ github.actor }}
        TAGGER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
      run: |
        $tagged = git rev-parse -q --verify "refs/tags/$($env:RELEASE_VERSION)^{commit}"

        if ($tagged) {
          if ($tagged -ne $env:RELEASE_COMMIT) {
            Write-Host "::error::Tag '$env:RELEASE_VERSION' already exists and points to $tagged (not $env:RELEASE_COMMIT)"
            exit 1
          }

          Write-Host "Tag '$env:RELEASE_VERSION' already exists for $env:RELEASE_COMMIT"
          exit 0
        }

        git -c "user.name=$env:TAGGER_NAME" -c "user.email=$env:TAGGER_EMAIL" tag -a $env:RELEASE_VERSION -m "Tagged for $env:RELEASE_VERSION" $env:RELEASE_COMMIT
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git push origin "refs/tags/$($env:RELEASE_VERSION)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
